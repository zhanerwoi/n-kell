<script>
/* N-KELL — Engine: assessment scoring, unified profile, explainable career matching,
   insights and next-step logic. Pure functions only (no DOM), so they can be unit-tested
   and later moved to a backend unchanged. */
window.NK = window.NK || {};
NK.Engine = (function () {
  'use strict';

  /* ---------- Configuration (documented, user-adjustable) ----------
     Weights are initial DESIGN ASSUMPTIONS for an exploratory model, not scientific coefficients.
     interests   — Holland RIASEC interests (dedicated test, or the express test as fallback)
     strengths   — self-reported strengths (Strengths test, or express ability items)
     values      — work values
     env         — preferred work environment
     motivation  — motivational drivers
     personality — Big Five preferences that relate to the career's typical tasks
                   (Emotional Stability is deliberately NOT used for matching). */
  const CONFIG = {
    weights: { interests: 0.35, strengths: 0.20, values: 0.15, env: 0.10, motivation: 0.10, personality: 0.10 },
    codeWeights: [0.5, 0.3, 0.2],
    bands: { low: 40, high: 60 } // <40 lower · 40–59 balanced · ≥60 higher
  };
  const COMPONENTS = Object.keys(CONFIG.weights);

  /* ---------- Answer validation ---------- */
  function validAnswer(item, a) {
    if (a == null) return false;
    switch (item.type) {
      case 'likert': case 'bipolar': return Number.isInteger(a) && a >= 1 && a <= 5;
      case 'choice': return Number.isInteger(a) && a >= 0 && a < item.opts.length;
      case 'pair': return a === 'a' || a === 'b';
      default: return false;
    }
  }

  /* ---------- Generic scoring with reverse keys and normalisation ----------
     Skipped/invalid answers are excluded from BOTH earned and max points. */
  function scoreTest(test, answers) {
    const earned = {}, max = {}, n = {};
    test.dims.forEach(d => { earned[d] = 0; max[d] = 0; n[d] = 0; });
    const add = (d, e, m) => { if (!(d in max)) return; earned[d] += e; max[d] += m; n[d]++; };
    let answered = 0;
    test.items.forEach(it => {
      const a = answers ? answers[it.id] : undefined;
      if (!validAnswer(it, a)) return;
      answered++;
      if (it.type === 'likert') add(it.dim, it.rev ? 5 - a : a - 1, 4);
      else if (it.type === 'bipolar') { add(it.l.d, 5 - a, 4); add(it.r.d, a - 1, 4); }
      else if (it.type === 'pair') { const win = a === 'a' ? it.a.d : it.b.d; add(it.a.d, win === it.a.d ? 2 : 0, 2); add(it.b.d, win === it.b.d ? 2 : 0, 2); }
      else if (it.type === 'choice') {
        const dims = new Set(); it.opts.forEach(o => Object.keys(o.p).forEach(d => dims.add(d)));
        dims.forEach(d => add(d, it.opts[a].p[d] || 0, Math.max.apply(null, it.opts.map(o => o.p[d] || 0))));
      }
    });
    const scores = {};
    test.dims.forEach(d => { scores[d] = max[d] > 0 ? Math.round(earned[d] / max[d] * 100) : null; });
    return { scores, n, answered, total: test.items.length };
  }

  const band = v => (v == null ? 'na' : v < CONFIG.bands.low ? 'low' : v < CONFIG.bands.high ? 'mid' : 'high');
  const sortDims = (scores) => Object.keys(scores).filter(k => scores[k] != null).sort((a, b) => scores[b] - scores[a] || a.localeCompare(b));
  const mean = arr => (arr.length ? arr.reduce((s, v) => s + v, 0) / arr.length : null);

  /* ---------- Unified profile (best available source per component) ---------- */
  function testResult(data, id) { const r = data.tests && data.tests[id]; return r && r.done && r.result ? r.result : null; }
  function unifiedProfile(data) {
    const ex = data.results && data.results.length ? data.results[data.results.length - 1].scores : null;
    const pick = (src, map) => { const o = {}; Object.keys(map).forEach(k => { const v = typeof map[k] === 'function' ? map[k](src) : src[map[k]]; if (v != null && !isNaN(v)) o[k] = Math.round(v); }); return o; };
    const from = (id, fallback) => { const r = testResult(data, id); if (r) return { s: r.scores, src: id, date: r.date }; return fallback || null; };
    return {
      riasec: from('riasec', ex && { s: pick(ex, { R: 'R', I: 'I', A: 'A', S: 'S', E: 'E', C: 'C' }), src: 'express' }),
      strengths: from('strengths', ex && { s: pick(ex, { analytic: 'an', logic: 'an', math: 'ma', creat: 'cr', verbal: 'co', tech: e => (e.pr + e.di) / 2, leader: 'lead', team: 'team' }), src: 'express' }),
      values: from('values', ex && { s: pick(ex, { money: 'money', indep: 'indep', vcre: 'vcre', impact: 'impact', recog: 'recog', growth: 'growth', help: 'help' }), src: 'express' }),
      env: from('env', ex && { s: pick(ex, { office: 'office', field: 'outdoor', lab: 'lab', studio: 'studio', people: 'people', remote: 'remote', dynamic: 'dyn', struct: 'struct', solo: 'solo', collab: 'team', lead: 'lead', practical: 'hands', theory: 'res' }), src: 'express' }),
      motivation: from('motivation'),
      bigfive: from('bigfive'),
      learning: from('learning'),
      readiness: from('readiness')
    };
  }

  /* ---------- Profession features (derived transparently from catalogue data) ---------- */
  const AB2S = { an: ['analytic', 'logic'], ma: ['math'], cr: ['creat'], co: ['verbal'], pr: ['tech', 'probsolve'], di: ['tech'] };
  const VA2V = { money: ['money', 'secur'], vcre: ['vcre'], help: ['help'], indep: ['indep'], impact: ['impact'], growth: ['growth', 'intel'], recog: ['recog'] };
  const EN2E = { office: ['office'], outdoor: ['field'], lab: ['lab'], studio: ['studio'], people: ['people'], remote: ['remote'], dyn: ['dynamic', 'flex'], struct: ['struct', 'stable'] };
  const PE2 = { strengths: { lead: ['leader'], team: ['team'], res: ['analytic'] }, values: { lead: ['lead'], team: ['collab'] }, env: { solo: ['solo'], team: ['collab'], hands: ['practical'], res: ['theory'], lead: ['lead'] }, personality: { team: ['A'], lead: ['E'], res: ['O'] } };
  const VA2M = { money: ['fin'], recog: ['mrecog'], help: ['contrib'], impact: ['contrib'], indep: ['auto'], growth: ['pgrowth', 'curio'], vcre: ['auto'] };
  const CODE2M = { R: ['ach'], I: ['curio'], A: ['auto'], S: ['contrib'], E: ['comp', 'ach'], C: ['ach'] };
  const CODE2B = { R: ['C'], I: ['O'], A: ['O'], S: ['A', 'E'], E: ['E'], C: ['C'] };
  const _feat = {};
  function profFeatures(p) {
    if (_feat[p.id]) return _feat[p.id];
    const S = () => new Set();
    const f = { strengths: S(), values: S(), env: S(), motivation: S(), personality: S() };
    const put = (set, arr) => (arr || []).forEach(x => set.add(x));
    p.ab.forEach(k => put(f.strengths, AB2S[k]));
    p.va.forEach(k => { put(f.values, VA2V[k]); put(f.motivation, VA2M[k]); });
    p.en.forEach(k => put(f.env, EN2E[k]));
    p.pe.forEach(k => ['strengths', 'values', 'env', 'personality'].forEach(c => put(f[c], PE2[c][k])));
    p.code.split('').forEach((l, i) => { if (i < 2) { put(f.motivation, CODE2M[l]); put(f.personality, CODE2B[l]); } });
    const out = { code: p.code };
    Object.keys(f).forEach(k => { out[k] = Array.from(f[k]); });
    return (_feat[p.id] = out);
  }

  /* ---------- Explainable matching ---------- */
  function getWeights(data) {
    const w = Object.assign({}, CONFIG.weights);
    if (data && data.weights) COMPONENTS.forEach(k => { const v = +data.weights[k]; if (!isNaN(v) && v >= 0 && v <= 1) w[k] = v; });
    return w;
  }
  function matchCareer(p, P, w, data) {
    const F = profFeatures(p);
    const vec = c => (P[c] ? P[c].s : null);
    const comps = {};
    const R = vec('riasec');
    if (R) { const letters = F.code.split(''); const have = letters.map((l, i) => [l, CONFIG.codeWeights[i]]).filter(([l]) => R[l] != null); const ws = have.reduce((s, x) => s + x[1], 0); comps.interests = ws ? have.reduce((s, [l, cw]) => s + cw * R[l], 0) / ws : null; } else comps.interests = null;
    const avg = (c, src) => { const v = vec(src); if (!v) return null; return mean(F[c].filter(d => v[d] != null).map(d => v[d])); };
    comps.strengths = avg('strengths', 'strengths');
    comps.values = avg('values', 'values');
    comps.env = avg('env', 'env');
    comps.motivation = avg('motivation', 'motivation');
    comps.personality = avg('personality', 'bigfive');
    const avail = COMPONENTS.filter(c => comps[c] != null && w[c] > 0);
    const wsum = avail.reduce((s, c) => s + w[c], 0);
    const wall = COMPONENTS.reduce((s, c) => s + w[c], 0) || 1;
    const total = wsum ? Math.round(avail.reduce((s, c) => s + w[c] * comps[c], 0) / wsum) : null;
    // Evidence for explanations
    const good = (src, dims, th) => { const v = vec(src); return v ? dims.filter(d => v[d] != null && v[d] >= th).sort((a, b) => v[b] - v[a]).map(d => [d, v[d]]) : []; };
    const lowOf = (src, dims, th) => { const v = vec(src); return v ? dims.filter(d => v[d] != null && v[d] < th).sort((a, b) => v[a] - v[b]).map(d => [d, v[d]]) : []; };
    const ev = {
      interests: R ? F.code.split('').filter(l => R[l] != null && R[l] >= 55).map(l => [l, R[l]]) : [],
      strengths: good('strengths', F.strengths, 60),
      values: good('values', F.values, 60),
      motivation: good('motivation', F.motivation, 60),
      develop: lowOf('strengths', F.strengths, 50),
      challengesEnv: lowOf('env', F.env, 40),
      challengesInt: R ? F.code.split('').slice(0, 1).filter(l => R[l] != null && R[l] < 40).map(l => [l, R[l]]) : [],
      challengesPers: lowOf('bigfive', F.personality.filter(d => d !== 'ES'), 35)
    };
    const simId = NK.SIM_FOR && NK.SIM_FOR[p.id];
    const sim = simId && data && data.sims && data.sims[simId] ? { id: simId, best: data.sims[simId].best } : null;
    return { id: p.id, total, comps, coverage: wsum / wall, avail, ev, sim, F };
  }

  /* ---------- "Beyond your first choice" themes ---------- */
  const THEMES = [
    { id: 'math', when: (R, S) => (S.math >= 60 || S.analytic >= 60) || (R.I >= 55 && R.C >= 55), profs: ['data', 'fin', 'actuary', 'opsres', 'quant'] },
    { id: 'arttech', when: (R, S) => R.A >= 55 && (S.tech >= 55 || R.I >= 55 || R.R >= 55), profs: ['ux', 'prodes', 'anim', 'graphic', 'archi'] },
    { id: 'peoplesci', when: (R) => R.S >= 55 && R.I >= 55, profs: ['psych', 'doctor', 'nurse', 'edtech', 'vet'] },
    { id: 'biztech', when: (R, S) => R.E >= 55 && (R.I >= 55 || S.tech >= 55), profs: ['data', 'supply', 'prodes', 'entre', 'opsres'] },
    { id: 'nature', when: (R) => R.R >= 55 && R.I >= 55, profs: ['agron', 'ecol', 'roboeng', 'bio'] },
    { id: 'words', when: (R, S) => S.verbal >= 60 || (R.A >= 55 && R.S >= 55), profs: ['journ', 'pr', 'diplomat', 'lawyer', 'edtech'] }
  ];

  function recommend(data, profs) {
    const P = unifiedProfile(data);
    const w = getWeights(data);
    const list = profs.map(p => matchCareer(p, P, w, data)).filter(m => m.total != null)
      .sort((a, b) => b.total - a.total || a.id.localeCompare(b.id));
    const byId = Object.fromEntries(list.map(m => [m.id, m]));
    const best = list.slice(0, 8);
    const bestIds = new Set(best.map(m => m.id));
    const R = P.riasec ? P.riasec.s : {}; const S = P.strengths ? P.strengths.s : {};
    const beyond = []; const seen = new Set();
    THEMES.forEach(th => {
      if (!th.when(R, S)) return;
      th.profs.forEach(id => { if (byId[id] && !bestIds.has(id) && !seen.has(id)) { seen.add(id); beyond.push({ m: byId[id], theme: th.id }); } });
    });
    if (beyond.length < 3) {
      const topCats = new Set(best.slice(0, 4).map(m => profs.find(p => p.id === m.id).cat));
      list.slice(8).filter(m => !seen.has(m.id) && !topCats.has(profs.find(p => p.id === m.id).cat)).slice(0, 3 - beyond.length)
        .forEach(m => { seen.add(m.id); beyond.push({ m, theme: 'other' }); });
    }
    beyond.sort((a, b) => b.m.total - a.m.total);
    const coverage = list.length ? list[0].coverage : 0;
    const availComps = COMPONENTS.filter(c => list.length && list[0].comps[c] != null);
    return { P, w, list, byId, best, beyond: beyond.slice(0, 6), coverage, availComps };
  }

  /* ---------- Simulation-demonstrated skills ---------- */
  const SIM_SKILLS = { prog: ['logic', 'probsolve', 'tech'], data: ['analytic', 'math'], marketing: ['creat', 'analytic', 'verbal'], finance: ['math', 'analytic'], architect: ['creat', 'probsolve'], journal: ['verbal', 'analytic'], design: ['creat'], econ: ['math', 'analytic'], doctor: ['analytic', 'verbal'], engineer: ['math', 'probsolve', 'tech'] };
  function demonstrated(data) {
    const out = {};
    Object.keys(SIM_SKILLS).forEach(sid => {
      const r = data.sims && data.sims[sid]; if (!r) return;
      SIM_SKILLS[sid].forEach(d => { if (!out[d] || out[d].score < r.best) out[d] = { score: r.best, sim: sid }; });
    });
    return out;
  }

  /* ---------- Insights (rule-based, each tied to a source score) ---------- */
  function insights(P) {
    const out = [];
    const CAT = k => (/^ins_[RIASEC]$/.test(k) ? 'riasec' : k === 'ins_value' ? 'values' : /^ins_(struct|flex|collab|solo)$/.test(k) ? 'env' : k === 'ins_motiv' ? 'motivation' : /^ins_[COE]_/.test(k) ? 'bigfive' : k === 'ins_learn' ? 'learning' : k === 'ins_techsolve' ? 'strengths' : 'readiness');
    const push = (k, src, dim, score, vars) => out.push({ k, src, dim, score, cat: CAT(k), vars: vars || {} });
    if (P.riasec) { const top = sortDims(P.riasec.s)[0]; if (top && P.riasec.s[top] >= 60) push('ins_' + top, P.riasec.src, top, P.riasec.s[top]); }
    if (P.riasec && P.strengths) { const R = P.riasec.s, S = P.strengths.s; if (R.I >= 60 && (S.tech >= 60 || S.logic >= 60)) push('ins_techsolve', 'strengths', 'tech', Math.max(S.tech || 0, S.logic || 0)); }
    if (P.values) { const top = sortDims(P.values.s)[0]; if (top && P.values.s[top] >= 70) push('ins_value', P.values.src, top, P.values.s[top], { dim: top }); }
    if (P.env) {
      const E = P.env.s;
      if (E.struct >= 65 && (E.flex == null || E.struct > E.flex)) push('ins_struct', P.env.src, 'struct', E.struct);
      else if (E.flex >= 65) push('ins_flex', P.env.src, 'flex', E.flex);
      if (E.collab >= 65 && (E.solo == null || E.collab > E.solo)) push('ins_collab', P.env.src, 'collab', E.collab);
      else if (E.solo >= 65) push('ins_solo', P.env.src, 'solo', E.solo);
    }
    if (P.motivation) { const top = sortDims(P.motivation.s)[0]; if (top && P.motivation.s[top] >= 70) push('ins_motiv', 'motivation', top, P.motivation.s[top], { dim: top }); }
    if (P.bigfive) {
      const B = P.bigfive.s;
      if (B.C >= 70) push('ins_C_hi', 'bigfive', 'C', B.C);
      if (B.O >= 70) push('ins_O_hi', 'bigfive', 'O', B.O);
      if (B.E != null && B.E <= 30) push('ins_E_lo', 'bigfive', 'E', B.E);
      if (B.E >= 70) push('ins_E_hi', 'bigfive', 'E', B.E);
    }
    if (P.learning) { const top = sortDims(P.learning.s)[0]; if (top && P.learning.s[top] >= 70) push('ins_learn', 'learning', top, P.learning.s[top], { dim: top }); }
    if (P.readiness) { const avg = mean(Object.values(P.readiness.s).filter(v => v != null)); if (avg != null) push(avg < 45 ? 'ins_ready_lo' : avg >= 70 ? 'ins_ready_hi' : 'ins_ready_mid', 'readiness', null, Math.round(avg)); }
    return out;
  }

  /* ---------- Development recommendations ---------- */
  function development(P, rec, data) {
    const demo = demonstrated(data);
    const keep = P.strengths ? sortDims(P.strengths.s).filter(d => P.strengths.s[d] >= 60).slice(0, 3).map(d => ({ d, self: P.strengths.s[d], sim: demo[d] })) : [];
    Object.keys(demo).forEach(d => { if (demo[d].score >= 70 && !keep.find(x => x.d === d) && keep.length < 5) keep.push({ d, self: P.strengths ? P.strengths.s[d] : null, sim: demo[d] }); });
    const need = {};
    rec.best.slice(0, 5).forEach(m => m.ev.develop.forEach(([d, v]) => { (need[d] = need[d] || { d, v, profs: [] }).profs.push(m.id); }));
    const improve = Object.values(need).sort((a, b) => b.profs.length - a.profs.length || a.v - b.v).slice(0, 4);
    const explore = rec.beyond.slice(0, 3);
    return { keep, improve, explore };
  }

  /* ---------- Next best step ---------- */
  function nextStep(data, rec) {
    const done = id => !!testResult(data, id);
    const hasInterests = done('riasec') || (data.results && data.results.length);
    if (!hasInterests) return { k: 'ns_riasec', href: 'test-riasec' };
    if (!done('values')) return { k: 'ns_values', href: 'test-values' };
    if ((data.viewed || []).length < 3) return { k: 'ns_explore', href: 'recs' };
    const sims = Object.keys(data.sims || {});
    if (!sims.length) { const top = rec.best.find(m => NK.SIM_FOR[m.id]); return { k: 'ns_sim', href: 'sim-' + (top ? NK.SIM_FOR[top.id] : 'prog'), vars: { p: top ? top.id : null } }; }
    if (!(data.compares || []).length) return { k: 'ns_compare', href: 'compare' };
    if (!data.untVisited) return { k: 'ns_unt', href: 'unt' };
    const pending = NK.TESTS.find(tst => !done(tst.id));
    if (pending) return { k: 'ns_test', href: 'test-' + pending.id, vars: { test: pending.id } };
    return { k: 'ns_road', href: 'roadmap' };
  }

  return { CONFIG, COMPONENTS, validAnswer, scoreTest, band, sortDims, mean, unifiedProfile, testResult, profFeatures, getWeights, matchCareer, recommend, THEMES, SIM_SKILLS, demonstrated, insights, development, nextStep };
})();

<script>
/* N-KELL — Career simulator: 10 interactive, deterministic mini-experiences (KZ/RU/EN).
   Multi-stage simulations share one stage runner that gives feedback after each decision
   and a final performance report. Results are educational indicators, not qualifications. */
(function () {
  'use strict';
  const NK = window.NK;
  const T = (kz, ru, en) => ({ kz, ru, en });
  const tx = o => NK.L(o);
  const esc = s => NK.esc(s);
  const ic = (n, c) => NK.icon(n, c);
  const t = k => NK.t(k);
  const clamp = v => Math.max(0, Math.min(100, Math.round(v)));
  const UI = {
    stage: T('Кезең', 'Этап', 'Stage'), check: T('Тексеру', 'Проверить', 'Check'), next: T('Келесі кезең', 'Следующий этап', 'Next stage'), finish: T('Қорытынды есеп', 'Итоговый отчёт', 'Final report'),
    report: T('Қорытынды есеп', 'Итоговый отчёт', 'Final performance report'), again: T('Қайта бастау', 'Начать заново', 'Start again'),
    edu: T('Бұл — оқу көрсеткіші, кәсіби біліктілік емес.', 'Это учебный показатель, а не профессиональная квалификация.', 'This is an educational indicator, not a professional qualification.'),
    crit: { reasoning: T('Пайымдау', 'Рассуждение', 'Reasoning'), accuracy: T('Дәлдік', 'Точность', 'Accuracy'), decision: T('Шешім қабылдау', 'Принятие решений', 'Decision-making'), creativity: T('Шығармашылық', 'Креативность', 'Creativity'), completion: T('Тапсырманы орындау', 'Выполнение задачи', 'Task completion') },
    pick: T('Таңдаңыз', 'Выберите', 'Choose'), selected: T('таңдалды', 'выбрано', 'selected')
  };

  function resultBox(score, lines) {
    return `<div class="sim-res ${score >= 70 ? 'good' : score >= 40 ? 'mid' : 'low'}">${NK.ring(score, 76)}<div><h4>${esc(t('sim_result'))}</h4>${lines.map(l => `<p class="${l[0] ? 'ok' : 'no'}">${ic(l[0] ? 'check-circle-2' : 'alert-triangle')} ${esc(typeof l[1] === 'string' ? l[1] : tx(l[1]))}</p>`).join('')}<p class="tiny muted">${esc(tx(UI.edu))}</p></div></div>`;
  }
  const optBtn = (i, text, on, attr, disabled, multi) => `<button class="opt ${on ? 'on' : ''}" ${attr}="${i}" ${disabled ? 'disabled' : ''} role="${multi ? 'checkbox' : 'radio'}" aria-checked="${on}"><span class="opt-k">${multi ? ic(on ? 'check' : 'plus') : String.fromCharCode(65 + i)}</span><span>${esc(tx(text))}</span></button>`;

  /* ---------- Stage runner ----------
     stage = { title, mount(box, submit, locked, state) } ; submit({score, crit:{..}, fb:[[ok, text]]}) */
  function runStages(el, done, stages) {
    let i = 0, res = [], state = {};
    function draw() {
      const cur = res[i];
      el.innerHTML = `<div class="stages" aria-label="progress">${stages.map((s, k) => `<span class="${k < i ? 'past' : k === i ? 'cur' : ''}"><b>${k + 1}</b>${esc(tx(s.title))}</span>`).join('')}</div>
        <div class="card stage"><h4>${esc(tx(UI.stage))} ${i + 1}/${stages.length}: ${esc(tx(stages[i].title))}</h4><div class="st-body"></div>
        ${cur ? `<div class="st-fb">${cur.fb.map(f => `<p class="${f[0] ? 'ok' : 'no'}">${ic(f[0] ? 'check-circle-2' : 'alert-triangle')} ${esc(tx(f[1]))}</p>`).join('')}</div><button class="btn btn-violet btn-sm" data-stnext>${esc(tx(i === stages.length - 1 ? UI.finish : UI.next))} ${ic('arrow-right')}</button>` : ''}</div>`;
      stages[i].mount(el.querySelector('.st-body'), r => { res[i] = r; draw(); }, !!cur, state);
      const nb = el.querySelector('[data-stnext]');
      if (nb) nb.addEventListener('click', () => { if (i < stages.length - 1) { i++; draw(); } else report(); });
    }
    function report() {
      const total = clamp(res.reduce((s, r) => s + r.score, 0) / res.length);
      const crit = {};
      res.forEach(r => Object.keys(r.crit || {}).forEach(k => { (crit[k] = crit[k] || []).push(r.crit[k]); }));
      Object.keys(crit).forEach(k => { crit[k] = clamp(crit[k].reduce((s, v) => s + v, 0) / crit[k].length); });
      crit.completion = 100;
      el.innerHTML = `<div class="card"><h4>${ic('trophy')} ${esc(tx(UI.report))}</h4>
        <div class="sim-rep">${NK.ring(total, 96)}<div class="sim-rep-c">${Object.keys(crit).map(k => `<div class="bar-row"><div class="bar-lbl"><span>${esc(tx(UI.crit[k]))}</span><b>${crit[k]}%</b></div><div class="bar"><i style="--w:${Math.max(2, crit[k])}%"></i></div></div>`).join('')}</div></div>
        <ol class="st-list">${stages.map((s, k) => `<li><span>${esc(tx(s.title))}</span><b>${res[k].score}%</b></li>`).join('')}</ol>
        <p class="tiny muted">${ic('info')} ${esc(tx(UI.edu))}</p>
        <button class="btn btn-ghost btn-sm" data-again>${ic('rotate-ccw')} ${esc(tx(UI.again))}</button></div>`;
      el.querySelector('[data-again]').addEventListener('click', () => { i = 0; res = []; state = {}; draw(); });
      done(total, crit);
    }
    draw();
  }
  /* single-choice stage factory */

      const RS = [[T('Ұйқы режимі: 8–10 сағат, ұйқы алдында 1 сағат экрансыз', 'Режим сна: 8–10 часов, за час до сна без экрана', 'Sleep routine: 8–10 hours, no screens an hour before bed'), 1], [T('Таңғы ас және жеткілікті су', 'Завтрак и достаточно воды', 'Breakfast and enough water'), 1], [T('Экран уақытын азайтып, үзіліс жасау', 'Меньше экранного времени, перерывы', 'Less screen time and regular breaks'), 1], [T('Белгілер жалғасса — мейірбикеге немесе дәрігерге қаралу', 'Если симптомы сохраняются — к медсестре или врачу', 'If it continues — see the school nurse or a doctor'), 2], [T('Өз бетімен ауырсынуды басатын дәрі ішу', 'Самостоятельно пить обезболивающие', 'Take painkillers on your own'), 0], [T('Энергетикалық сусын ішу', 'Пить энергетики', 'Drink energy drinks'), 0], [T('Ештеңе істемеу', 'Ничего не делать', 'Do nothing'), 0]];
      let asked = [], recs = [], stage = 1, res = '';

      function bridgeSvg(fail) {

<script>

window.NK = window.NK || {};
(function () {

  };
  const has = (s, list) => list.some(k => s.includes(k));

  const R = {
    intro: T('Мен — N-KELL кеңесшісімін. Жауаптарым алдын ала жазылған ережелерге және сенің профиліңе негізделген. Мен жасанды интеллект емеспін.', 'Я — помощник N-KELL. Мои ответы основаны на заранее написанных правилах и твоём профиле. Я не искусственный интеллект.', 'I am the N-KELL career guide. My replies are based on pre-written rules and your profile. I am not an AI.'),
    noconsent: T('Профиліңді контекст ретінде пайдалануға рұқсат берілмеген, сондықтан жалпы түрде жауап беремін. Рұқсатты жоғарыдағы ауыстырғышпен беруге болады.', 'Ты не разрешил использовать свой профиль как контекст, поэтому отвечаю в общем виде. Разрешение можно включить переключателем выше.', 'You have not allowed me to use your profile, so I will answer in general terms. You can turn this on with the switch above.'),
    safety: T('Осы туралы айтқаныңа рахмет. Мен — мамандық таңдауға арналған көмекшімін және психологиялық көмек көрсете алмаймын. Өзіңді жайсыз сезінсең, сенімді ересекпен, мектеп психологымен сөйлес. Балалар мен жастарға арналған сенім телефоны — 150, шұғыл жағдайда — 112.', 'Спасибо, что поделился. Я — помощник по выбору профессии и не могу оказывать психологическую помощь. Если тебе тяжело, поговори со взрослым, которому доверяешь, или со школьным психологом. Телефон доверия для детей и молодёжи — 150, в экстренной ситуации — 112.', 'Thank you for sharing this. I am a career guidance assistant and cannot provide psychological help. If you are struggling, please talk to a trusted adult or your school psychologist. The helpline for children and young people in Kazakhstan is 150; in an emergency call 112.'),
    unsure: T('Таңдай алмау — 9–11 сыныпта өте қалыпты жағдай. Шешімді бірден қабылдау міндетті емес. Кішкентай қадамнан баста: бір тест, бір мамандық беті, бір симулятор.', 'Не знать, что выбрать, — совершенно нормально в 9–11 классе. Решать прямо сейчас не обязательно. Начни с маленького шага: один тест, одна страница профессии, один симулятор.', 'Not knowing what to choose is completely normal in grades 9–11. You do not have to decide now. Start small: one test, one career page, one simulation.'),
    fallback: T('Мен мыналарға көмектесе аламын: нәтижеңді түсіндіру, мамандықтарды салыстыру, ҰБТ пәндері, келесі қадам. Төмендегі сұрақтардың бірін таңда немесе мамандық атын жаз.', 'Я могу помочь: объяснить результаты, сравнить профессии, подсказать предметы ЕНТ и следующий шаг. Выбери вопрос ниже или напиши название профессии.', 'I can help explain your results, compare careers, discuss UNT subjects or suggest your next step. Pick a question below or type a career name.'),
    reflect: [T('Қандай сабақта уақыттың қалай өткенін байқамайсың?', 'На каком уроке ты не замечаешь, как летит время?', 'In which lesson do you lose track of time?'), T('5 жылдан кейінгі әдеттегі жұмыс күніңді елестет: қайдасың, кіммен бірге?', 'Представь обычный рабочий день через 5 лет: где ты и с кем?', 'Picture a normal working day five years from now: where are you, and who are you with?'), T('Бұл таңдау кімнің арманы — сенікі ме, әлде біреудің күтуі ме?', 'Чья это мечта — твоя или чьи-то ожидания?', 'Whose dream is this choice — yours, or someone else\'s expectation?')]
  };
  const chipsFor = lang => [T('Менің нәтижемді түсіндір', 'Объясни мои результаты', 'Explain my results'), T('Келесі қадамым қандай?', 'Какой мой следующий шаг?', 'What is my next step?'), T('Дәрігер мен биотехнологты салыстыр', 'Сравни врача и биотехнолога', 'Compare doctor and biotechnologist'), T('Бағдарламашыға қандай ҰБТ пәндері керек?', 'Какие предметы ЕНТ нужны программисту?', 'Which UNT subjects does a developer need?'), T('Не таңдарымды білмеймін', 'Не знаю, что выбрать', 'I don\'t know what to choose')].map(o => L(o, lang));

  function reply({ text, lang, context }) {
    const s = ' ' + norm(text) + ' ';
    const out = [];
    const t = (k, v) => NK.t(k, v);
    const ctx = context; // null when no consent
    const profs = findProfs(s);
    const ask = () => L(R.reflect[(text.length + (profs[0] ? profs[0].id.length : 0)) % R.reflect.length], lang);

    if (has(s, KW.safety)) return { text: L(R.safety, lang), chips: chipsFor(lang), safety: true };
    if (has(s, KW.unsure)) { out.push(L(R.unsure, lang)); if (ctx && ctx.next) out.push(t('mt_next', { step: ctx.next })); out.push(ask()); return { text: out.join('\n\n'), chips: chipsFor(lang) }; }

    if (profs.length >= 2 && has(s, KW.compare)) {
      const [a, b] = profs;
      out.push(t('mt_cmp_intro', { a: pn(a, lang), b: pn(b, lang) }));
      out.push(t('mt_cmp_codes', { a: pn(a, lang), ca: a.code, b: pn(b, lang), cb: b.code }));
      if (ctx && ctx.rec) { const ma = ctx.rec.byId[a.id], mb = ctx.rec.byId[b.id]; if (ma && mb) out.push(t('mt_cmp_match', { a: pn(a, lang), b: pn(b, lang), x: ma.total, y: mb.total })); }
      out.push(t('mt_cmp_tool'));
      out.push(ask());
      return { text: out.join('\n\n'), chips: chipsFor(lang), link: 'compare' };
    }
    if (profs.length && has(s, KW.unt)) {
      const p = profs[0]; const prog = NK.UNT_PROGRAMS.find(g => g.profs.includes(p.id));
      out.push(prog && prog.combo ? t('mt_unt_combo', { p: pn(p, lang), combo: prog.combo.map(x => NK.subjName(x)).join(' + ') }) : t('mt_unt_none', { p: pn(p, lang) }));
      out.push(t('mt_unt_verify'));
      return { text: out.join('\n\n'), chips: chipsFor(lang), link: 'unt' };
    }
    if (profs.length) {
      const p = profs[0];
      out.push(t('mt_prof', { p: pn(p, lang), desc: NK.pc(p, 'd') }));
      if (ctx && ctx.rec && ctx.rec.byId[p.id]) {
        const m = ctx.rec.byId[p.id];
        out.push(t('mt_prof_match', { x: m.total }));
        const good = m.ev.interests.map(([l]) => t('k_' + l)).concat(m.ev.strengths.slice(0, 2).map(([d]) => NK.dimName('strengths', d)));
        if (good.length) out.push(t('mt_prof_good', { list: good.join(', ') }));
        if (m.ev.develop.length) out.push(t('mt_prof_dev', { list: m.ev.develop.slice(0, 2).map(([d]) => NK.dimName('strengths', d)).join(', ') }));
      } else if (!ctx) out.push(L(R.noconsent, lang));
      out.push(ask());
      return { text: out.join('\n\n'), chips: chipsFor(lang), link: 'career-' + p.id };
    }
    if (has(s, KW.code)) {
      if (!ctx) return { text: L(R.noconsent, lang) + '\n\n' + t('mt_riasec_general'), chips: chipsFor(lang) };
      if (!ctx.P.riasec) return { text: t('mt_no_tests'), chips: chipsFor(lang), link: 'test-riasec' };
      const code = NK.Engine.sortDims(ctx.P.riasec.s).slice(0, 3);
      out.push(t('mt_code', { code: code.join(''), types: code.map(l => t('k_' + l)).join(', ') }));
      out.push(t('rd_' + code[0]));
      if (ctx.rec.best.length) out.push(t('mt_code_careers', { list: ctx.rec.best.slice(0, 3).map(m => pn(NK.PROF[m.id], lang) + ' (' + m.total + '%)').join(', ') }));
      out.push(t('mt_not_diag'));
      out.push(ask());
      return { text: out.join('\n\n'), chips: chipsFor(lang), link: 'me' };
    }
    if (has(s, KW.bigfive)) { out.push(t('mt_bigfive')); if (ctx && ctx.P.bigfive) out.push(t('mt_bigfive_you', { list: NK.Engine.sortDims(ctx.P.bigfive.s).slice(0, 2).map(d => NK.dimName('bigfive', d)).join(', ') })); return { text: out.join('\n\n'), chips: chipsFor(lang), link: 'test-bigfive' }; }
    if (has(s, KW.values)) { out.push(t('mt_values')); if (ctx && ctx.P.values) out.push(t('mt_values_you', { list: NK.Engine.sortDims(ctx.P.values.s).slice(0, 3).map(d => NK.dimName('values', d)).join(', ') })); out.push(ask()); return { text: out.join('\n\n'), chips: chipsFor(lang), link: 'test-values' }; }
    if (has(s, KW.unt)) return { text: t('mt_unt_general') + '\n\n' + t('mt_unt_verify'), chips: chipsFor(lang), link: 'unt' };
    if (has(s, KW.uni)) return { text: t('mt_uni'), chips: chipsFor(lang), link: 'unis' };
    if (has(s, KW.next)) { out.push(ctx ? t('mt_next', { step: ctx.next }) : L(R.noconsent, lang)); out.push(ask()); return { text: out.join('\n\n'), chips: chipsFor(lang), link: ctx ? ctx.nextHref : 'dashboard' }; }
    if (/^\s*(сәлем|салем|привет|здравств|hello|hi|hey)\b/.test(norm(text))) return { text: L(R.intro, lang) + '\n\n' + L(R.fallback, lang), chips: chipsFor(lang) };
    return { text: L(R.fallback, lang), chips: chipsFor(lang) };
  }

  NK.Mentor = { provider: { name: 'rules', reply: async (req) => reply(req) }, chipsFor, intro: lang => L(R.intro, lang) };
})();

<script>
/* N-KELL — cloud storage via Supabase (Postgres + Auth).
   Active only when assets/config.js contains a project URL and anon key.
   Everything a student writes is protected by row-level security (see supabase/schema.sql).
   The mentor chat log is never uploaded; it stays in the browser. */
window.NK = window.NK || {};
(function () {
  'use strict';
  const cfg = NK.CLOUD_CONFIG || {};
  const enabled = !!(cfg.url && cfg.anonKey && window.supabase && window.supabase.createClient);
  const C = {
    enabled, client: null, user: null, profile: null, membership: null, groups: null, overview: {},
    status: 'idle', lastError: null, _timer: null, _pending: null
  };
  if (enabled) {
    try { C.client = window.supabase.createClient(cfg.url, cfg.anonKey, { auth: { persistSession: true, autoRefreshToken: true } }); }
    catch (e) { C.enabled = false; console.warn('N-KELL: Supabase client could not start', e); }
  }
  const fail = (e) => { C.status = 'error'; C.lastError = e && (e.message || String(e)); throw e; };
  const chk = ({ data, error }) => { if (error) fail(error); return data; };

  C.me = () => (C.user && C.profile ? { id: C.user.id, nick: C.profile.nickname, grade: C.profile.grade, school: C.profile.school, role: C.profile.role, email: C.user.email, group: C.membership ? C.membership.group_code : null } : null);

  C.init = async () => {
    if (!C.enabled) return null;
    const { data } = await C.client.auth.getSession();
    C.user = data && data.session ? data.session.user : null;
    if (C.user) { await C.loadProfile(); await C.loadMembership(); }
    return C.user;
  };
  C.loadProfile = async () => { C.profile = chk(await C.client.from('profiles').select('nickname, grade, school, role').eq('id', C.user.id).maybeSingle()); return C.profile; };
  C.loadMembership = async () => {
    const rows = chk(await C.client.from('group_members').select('group_code, share_status, share_agg').eq('user_id', C.user.id).limit(1));
    C.membership = rows && rows[0] ? rows[0] : null;
    if (C.membership) { const n = chk(await C.client.rpc('group_name', { p_code: C.membership.group_code })); C.membership.name = n || C.membership.group_code; }
    return C.membership;
  };

  C.signUp = async ({ email, password, nickname, grade, school, role }) => {
    const r = await C.client.auth.signUp({ email, password, options: { data: { nickname, grade, school, role } } });
    if (r.error) fail(r.error);
    if (!r.data.session) return { needsConfirm: true };
    C.user = r.data.user; await C.loadProfile(); C.membership = null; return { ok: true };
  };
  C.signIn = async (email, password) => {
    const r = await C.client.auth.signInWithPassword({ email, password });
    if (r.error) fail(r.error);
    C.user = r.data.user; await C.loadProfile(); await C.loadMembership(); return { ok: true };
  };
  C.signOut = async () => { try { await C.client.auth.signOut(); } finally { C.user = null; C.profile = null; C.membership = null; C.groups = null; C.overview = {}; } };
  C.updateProfile = async (f) => { chk(await C.client.from('profiles').update(f).eq('id', C.user.id)); Object.assign(C.profile, f); };

  /* ---------- Student data ---------- */
  C.loadData = async () => { const row = chk(await C.client.from('user_data').select('data').eq('user_id', C.user.id).maybeSingle()); return row ? row.data : null; };
  const strip = d => { const o = JSON.parse(JSON.stringify(d)); if (o.mentor) o.mentor = { consent: !!o.mentor.consent, log: [] }; return o; };
  C.saveData = (data) => {
    if (!C.enabled || !C.user) return;
    C._pending = data; C.status = 'saving';
    clearTimeout(C._timer);
    C._timer = setTimeout(() => C.flush().catch(() => { if (NK.toast) NK.toast(NK.t('cloud_err')); }), 700);
  };
  C.flush = async () => {
    if (!C._pending || !C.user) return;
    const data = C._pending; C._pending = null;
    chk(await C.client.from('user_data').upsert({ user_id: C.user.id, data: strip(data), updated_at: new Date().toISOString() }));
    await C.syncMember(data);
    C.status = 'saved';
  };
  const summary = (data) => {
    const E = NK.Engine;
    const tests = NK.TESTS.filter(x => E.testResult(data, x.id)).map(x => x.id);
    const R = E.unifiedProfile(data).riasec;
    return { tests_done: tests, has_express: !!(data.results && data.results.length), sims_n: Object.keys(data.sims || {}).length, riasec: R ? R.s : null };
  };
  C.syncMember = async (data) => {
    if (!C.membership) return;
    const s = summary(data);
    chk(await C.client.from('group_members').update({ nickname: C.profile.nickname, tests_done: s.tests_done, has_express: s.has_express, sims_n: s.sims_n, riasec: C.membership.share_agg ? s.riasec : null, updated_at: new Date().toISOString() })
      .eq('group_code', C.membership.group_code).eq('user_id', C.user.id));
  };

  /* ---------- Groups (student side) ---------- */
  C.groupName = async (code) => chk(await C.client.rpc('group_name', { p_code: code }));
  C.joinGroup = async (code, shareStatus, shareAgg, data) => {
    const s = summary(data);
    chk(await C.client.from('group_members').insert({ group_code: code, user_id: C.user.id, nickname: C.profile.nickname, share_status: shareStatus, share_agg: shareAgg, tests_done: s.tests_done, has_express: s.has_express, sims_n: s.sims_n, riasec: shareAgg ? s.riasec : null }));
    await C.loadMembership();
  };
  C.leaveGroup = async () => { if (!C.membership) return; chk(await C.client.from('group_members').delete().eq('group_code', C.membership.group_code).eq('user_id', C.user.id)); C.membership = null; };
  C.setConsent = async (key, val, data) => {
    if (!C.membership) return;
    const f = key === 'agg' ? { share_agg: val, riasec: val ? summary(data).riasec : null } : { share_status: val };
    chk(await C.client.from('group_members').update(f).eq('group_code', C.membership.group_code).eq('user_id', C.user.id));
    if (key === 'agg') C.membership.share_agg = val; else C.membership.share_status = val;
  };

  /* ---------- Groups (teacher side) ---------- */
  C.listGroups = async () => { C.groups = chk(await C.client.from('groups').select('code, name, roster, created_at').eq('owner_id', C.user.id).order('created_at')); return C.groups; };
  C.createGroup = async (name) => {
    for (let i = 0; i < 5; i++) {
      const code = Array.from({ length: 6 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 32)]).join('');
      const r = await C.client.from('groups').insert({ code, name, owner_id: C.user.id });
      if (!r.error) return C.listGroups();
      if (r.error.code !== '23505') fail(r.error);
    }
    fail(new Error('code collision'));
  };
  C.deleteGroup = async (code) => { chk(await C.client.from('groups').delete().eq('code', code)); delete C.overview[code]; return C.listGroups(); };
  C.updateRoster = async (code, roster) => { chk(await C.client.from('groups').update({ roster }).eq('code', code)); return C.listGroups(); };
  C.loadOverview = async (code) => { C.overview[code] = chk(await C.client.rpc('group_overview', { p_code: code })); return C.overview[code]; };

  C.deleteAccount = async () => { chk(await C.client.rpc('delete_my_account')); await C.signOut(); };

  NK.Cloud = C;
})();

</script>
<script>
/* N-KELL — application core: storage, scoring, matching, router and pages. */
(function () {
  'use strict';
  const NK = window.NK;
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const icon = (n, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${NK.ICONS[n] || NK.ICONS['circle-dot']}</svg>`;
  NK.icon = icon; NK.esc = esc;

  /* ---------------- Storage (localStorage with in-memory fallback) ---------------- */
  const mem = {};
  const S = {
    get(k, d) {
      let v = null;
      try { v = localStorage.getItem(k); } catch (e) { v = null; }
      if (v != null) { try { return JSON.parse(v); } catch (e) { /* ignore */ } }
      return k in mem ? mem[k] : d;
    },
    set(k, v) { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
    del(k) { delete mem[k]; try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }
  };
  NK.S = S;

  const App = { lang: S.get('nk_lang', 'kz'), uid: S.get('nk_session', null), data: null, testView: 'intro', ui: {} };
  NK.App = App;
  const dataKey = uid => 'nk_data_' + (uid || 'guest');
  const blank = () => ({ answers: {}, qi: 0, results: [], favs: [], road: { done: {}, goals: [] }, sims: {}, tests: {}, viewed: [], compares: [], untVisited: false, tasks: [], mentor: { consent: false, log: [] }, weights: null, consent: {} });
  /* Validates stored data so a corrupted or older record never breaks the app. */
  const loadData = () => {
    const d = S.get(dataKey(App.uid), {}) || {};
    const b = blank(); App.data = Object.assign(b, typeof d === 'object' ? d : {});
    ['results', 'favs', 'viewed', 'compares', 'tasks'].forEach(k => { if (!Array.isArray(App.data[k])) App.data[k] = []; });
    ['sims', 'tests', 'answers', 'consent'].forEach(k => { if (!App.data[k] || typeof App.data[k] !== 'object' || Array.isArray(App.data[k])) App.data[k] = {}; });
    App.data.road = Object.assign({ done: {}, goals: [] }, App.data.road || {});
    if (!Array.isArray(App.data.road.goals)) App.data.road.goals = [];
    App.data.mentor = Object.assign({ consent: false, log: [] }, App.data.mentor || {});
    if (!Array.isArray(App.data.mentor.log)) App.data.mentor.log = [];
    App.ver = (App.ver || 0) + 1;
  };
  const save = () => { App.ver = (App.ver || 0) + 1; S.set(dataKey(App.uid), App.data); if (cloudOn() && App.uid) NK.Cloud.saveData(App.data); };
  NK.save = save;
  const users = () => S.get('nk_users', {});
  const cloudOn = () => !!(NK.Cloud && NK.Cloud.enabled);
  const me = () => (cloudOn() ? NK.Cloud.me() : (App.uid ? users()[App.uid] : null));
  if (!cloudOn() && App.uid && !users()[App.uid]) { App.uid = null; S.set('nk_session', null); }

  /* ---------------- i18n ---------------- */
  const t = (k, vars) => {
    if (cloudOn() && NK.I18N[App.lang] && NK.I18N[App.lang][k + '_cloud']) k = k + '_cloud';
    let s = (NK.I18N[App.lang] && NK.I18N[App.lang][k]) || NK.I18N.kz[k] || k;
    if (vars) Object.keys(vars).forEach(v => { s = s.split('{' + v + '}').join(vars[v]); });
    return s;
  };
  NK.t = t;
  const L = obj => (obj && (obj[App.lang] || obj.kz)) || '';
  NK.L = L;
  const pname = p => L(p.n);
  const catName = id => L((NK.CATS.find(c => c.id === id) || {}).n);
  const uniName = u => (App.lang === 'ru' ? u.ru : App.lang === 'en' ? u.en : u.n);
  /* Localised content helpers (Kazakh is the base; RU/EN come from content files) */
  NK.pc = (p, f) => { const tx = NK.PROF_TX && NK.PROF_TX[p.id] && NK.PROF_TX[p.id][App.lang]; return tx && tx[f] != null ? tx[f] : p[f]; };
  NK.pcl = (p, f) => { const v = NK.pc(p, f); return Array.isArray(v) ? v : String(v || '').split('|').filter(Boolean); };
  NK.pday = p => { const d = NK.PROF_TX && NK.PROF_TX[p.id] && NK.PROF_TX[p.id].day; return d ? L(d).split('|') : []; };
  NK.subjName = s => (NK.SUBJ_TX && NK.SUBJ_TX[s] ? L(NK.SUBJ_TX[s]) : s);
  NK.cityName = c => (NK.CITY_TX && NK.CITY_TX[c] ? L(NK.CITY_TX[c]) : c);
  NK.uniProgs = u => (App.lang !== 'kz' && NK.UNI_TX && NK.UNI_TX[u.id] ? NK.UNI_TX[u.id][App.lang].split('|') : u.prog);
  NK.dimName = (src, d) => { if (src === 'riasec' || src === 'express') return t('k_' + d); const x = NK.TEST[src]; return x && x.info[d] && x.info[d].name ? L(x.info[d].name) : d; };
  const qT = q => { const tx = NK.Q_TX && NK.Q_TX[q.id] && NK.Q_TX[q.id][App.lang]; return { t: (tx && tx.t) || q.text, s: (tx && tx.s) || q.scene, h: (tx && tx.h) || q.hint, o: (q.options || []).map((o, i) => (tx && tx.o && tx.o[i]) || o.t) }; };
  let _rec = { v: -1, uid: null, val: null };
  NK.rec = () => { if (_rec.v !== App.ver || _rec.uid !== App.uid) _rec = { v: App.ver, uid: App.uid, val: NK.Engine.recommend(App.data, NK.PROFS) }; return _rec.val; };
  const unified = () => { const r = NK.rec(); return r.list.length ? r : null; };

  /* ---------------- Scoring engine (transparent, deterministic) ---------------- */
  const ALLKEYS = [].concat(NK.KEYS.int, NK.KEYS.ab, NK.KEYS.pe, NK.KEYS.va, NK.KEYS.en);
  function maxPoints() {
    const m = {};
    const add = (k, v) => { m[k] = (m[k] || 0) + v; };
    NK.QUESTIONS.forEach(q => {
      if (q.type === 'scale') {
        Object.keys(q.p || {}).forEach(k => add(k, 4 * q.p[k]));
        Object.keys(q.rp || {}).forEach(k => add(k, 4 * q.rp[k]));
      } else if (q.type === 'multi') {
        const keys = new Set(); q.options.forEach(o => Object.keys(o.p).forEach(k => keys.add(k)));
        keys.forEach(k => {
          const vals = q.options.map(o => o.p[k] || 0).sort((a, b) => b - a).slice(0, q.max);
          add(k, vals.reduce((s, v) => s + v, 0));
        });
      } else {
        const keys = new Set(); q.options.forEach(o => Object.keys(o.p).forEach(k => keys.add(k)));
        keys.forEach(k => add(k, Math.max.apply(null, q.options.map(o => o.p[k] || 0))));
      }
    });
    return m;
  }
  const MAX = maxPoints();
  NK.MAX = MAX;

  function computeScores(answers) {
    const e = {};
    const add = (p, mult) => Object.keys(p || {}).forEach(k => { e[k] = (e[k] || 0) + p[k] * mult; });
    NK.QUESTIONS.forEach(q => {
      const a = answers[q.id];
      if (a == null) return;
      if (q.type === 'scale') { add(q.p, a - 1); add(q.rp, 5 - a); }
      else if (q.type === 'multi') (a || []).forEach(i => q.options[i] && add(q.options[i].p, 1));
      else if (q.options[a]) add(q.options[a].p, 1);
    });
    const sc = {};
    ALLKEYS.forEach(k => { sc[k] = MAX[k] ? Math.round((e[k] || 0) / MAX[k] * 100) : 0; });
    return sc;
  }
  NK.computeScores = computeScores;

  function matchProf(p, sc) {
    const letters = p.code.split('');
    const int = letters.reduce((s, l, i) => s + NK.CODE_WEIGHTS[i] * sc[l], 0);
    const avg = arr => (arr.length ? arr.reduce((s, k) => s + (sc[k] || 0), 0) / arr.length : 50);
    const parts = { int, ab: avg(p.ab), pe: avg(p.pe), va: avg(p.va), en: avg(p.en) };
    const total = Object.keys(NK.WEIGHTS).reduce((s, k) => s + NK.WEIGHTS[k] * parts[k], 0);
    return { id: p.id, total: Math.round(total), parts };
  }

  function analyze(sc) {
    const matches = NK.PROFS.map(p => matchProf(p, sc)).sort((a, b) => b.total - a.total || a.id.localeCompare(b.id));
    const byId = Object.fromEntries(matches.map(m => [m.id, m]));
    const riasec = NK.KEYS.int.slice().sort((a, b) => sc[b] - sc[a] || NK.KEYS.int.indexOf(a) - NK.KEYS.int.indexOf(b));
    const code = riasec.slice(0, 3).join('');
    const dirs = NK.CATS.map(c => {
      const ms = matches.filter(m => NK.PROF[m.id].cat === c.id).map(m => m.total).sort((a, b) => b - a).slice(0, 2);
      return { id: c.id, score: Math.round(ms.reduce((s, v) => s + v, 0) / (ms.length || 1)) };
    }).sort((a, b) => b.score - a.score);
    const top10 = matches.slice(0, 10);
    const alt = matches.slice(10, 15);
    const topDirIds = dirs.slice(0, 5).map(d => d.id);
    const rest = matches.slice(10);
    let unexp = rest.filter(m => !riasec.slice(0, 2).includes(NK.PROF[m.id].code[0]) && !topDirIds.includes(NK.PROF[m.id].cat));
    if (unexp.length < 3) unexp = unexp.concat(rest.filter(m => !riasec.slice(0, 2).includes(NK.PROF[m.id].code[0]) && !unexp.includes(m)));
    unexp = unexp.sort((a, b) => (b.parts.ab + b.parts.va) - (a.parts.ab + a.parts.va) || a.id.localeCompare(b.id)).slice(0, 3);
    const abSorted = NK.KEYS.ab.slice().sort((a, b) => sc[b] - sc[a]);
    const strengths = abSorted.slice(0, 3);
    const grow = abSorted.slice(-2).reverse();
    const envs = ['office', 'outdoor', 'lab', 'studio', 'people', 'remote'].sort((a, b) => sc[b] - sc[a]).slice(0, 2);
    const rhythm = sc.dyn >= sc.struct ? 'dyn' : 'struct';
    const skillNeed = {};
    top10.slice(0, 5).forEach(m => NK.PROF[m.id].ab.forEach(k => { if (sc[k] < 55) { (skillNeed[k] = skillNeed[k] || []).push(m.id); } }));
    const skills = Object.keys(skillNeed).sort((a, b) => skillNeed[b].length - skillNeed[a].length || sc[a] - sc[b]).map(k => ({ k, profs: skillNeed[k] }));
    return { matches, byId, riasec, code, dirs, top10, alt, unexp, strengths, grow, envs, rhythm, skills };
  }
  NK.analyze = analyze;

  /* ---------------- Radar chart (SVG) ---------------- */
  function radar(sc, prev, keysIn, labelFn) {
    const keys = keysIn || NK.KEYS.int, W = 340, cx = W / 2, cy = W / 2, R = 118;
    const lab = labelFn || (k => k); const val = k => (sc[k] == null ? 0 : sc[k]);
    const pt = (i, v) => { const a = -Math.PI / 2 + i * 2 * Math.PI / keys.length; return [cx + Math.cos(a) * R * v / 100, cy + Math.sin(a) * R * v / 100]; };
    let g = '';
    [25, 50, 75, 100].forEach(l => { g += `<polygon class="rg" points="${keys.map((k, i) => pt(i, l).join(',')).join(' ')}"/>`; });
    keys.forEach((k, i) => { const [x, y] = pt(i, 100); g += `<line class="rg" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`; });
    [50, 100].forEach(l => { const [x, y] = pt(0, l); g += `<text class="rtick" x="${x + 4}" y="${y + 3}">${l}</text>`; });
    if (prev) g += `<polygon class="rprev" points="${keys.map((k, i) => pt(i, prev[k] || 0).join(',')).join(' ')}"/>`;
    g += `<polygon class="rshape" points="${keys.map((k, i) => pt(i, val(k)).join(',')).join(' ')}"/>`;
    keys.forEach((k, i) => {
      const [x, y] = pt(i, val(k)); const [lx, ly] = pt(i, 128);
      const anchor = Math.abs(lx - cx) < 5 ? 'middle' : lx > cx ? 'start' : 'end';
      g += `<g class="rpt" tabindex="0"><circle cx="${x}" cy="${y}" r="5"/><title>${esc(keysIn ? lab(k) : t('k_' + k))}: ${sc[k] == null ? '—' : sc[k] + '%'}</title></g>`;
      g += `<text class="rlbl" x="${lx}" y="${ly + 4}" text-anchor="${anchor}"><tspan class="rl-k">${esc(lab(k))}</tspan> <tspan class="rl-v">${sc[k] == null ? '—' : sc[k] + '%'}</tspan></text>`;
    });
    return `<svg class="radar" viewBox="-70 -10 ${W + 140} ${W + 20}" role="img" aria-label="${esc(keys.join(', '))}">${g}</svg>`;
  }

  function testQuestion() {
    const qi = Math.min(App.data.qi, NK.QUESTIONS.length - 1);
    const q = NK.QUESTIONS[qi]; const a = App.data.answers[q.id]; const Q = qT(q);
    const dimIdx = NK.DIMS.findIndex(d => d.id === q.dim);
    const n = answeredCount(); const total = NK.QUESTIONS.length;
    let body = '';
    if (q.type === 'scale') {
      body = `<div class="scale" role="radiogroup" aria-label="${esc(Q.t)}">${[1, 2, 3, 4, 5].map(v => `<button class="sc ${a === v ? 'on' : ''}" data-act="ans" data-v="${v}" role="radio" aria-checked="${a === v}"><b>${v}</b><span>${esc(t('scale_' + v))}</span></button>`).join('')}</div>`;
    } else {
      const multi = q.type === 'multi';
      body = `<div class="opts ${q.options.length > 5 ? 'two' : ''}" role="${multi ? 'group' : 'radiogroup'}">${q.options.map((o, i) => { const on = multi ? (a || []).includes(i) : a === i; return `<button class="opt ${on ? 'on' : ''}" data-act="ans" data-v="${i}" role="${multi ? 'checkbox' : 'radio'}" aria-checked="${on}"><span class="opt-k">${multi ? icon(on ? 'check' : 'plus') : String.fromCharCode(65 + i)}</span><span>${esc(Q.o[i])}</span></button>`; }).join('')}</div>`;
      if (multi) body += `<p class="muted tiny">${(a || []).length}/${q.max} ${esc(t('selected'))}</p>`;
    }
    return `<section class="page test-pg"><div class="wrap narrow">
      <div class="tprog"><div class="tprog-top"><span>${esc(t('q_of'))} <b>${qi + 1}</b> / ${total}</span><span class="dimchip">${icon(NK.DIMS[dimIdx].icon)} ${dimIdx + 1}/5 · ${esc(t('dim_' + q.dim))}</span></div>
      <div class="tbar" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${n}"><i style="--w:${n / total * 100}%"></i></div>
      <div class="tdots">${NK.DIMS.map((d, i) => `<span class="${i < dimIdx ? 'past' : i === dimIdx ? 'cur' : ''}"></span>`).join('')}</div></div>
      <div class="qcard glass" key="${q.id}">
        ${q.scene ? `<div class="scene">${icon('lightbulb')}<div><small>${esc(t('situation'))}</small><p>${esc(Q.s)}</p></div></div>` : ''}

        ${Q.h ? `<p class="qhint">${esc(Q.h)}</p>` : ''}
        ${body}
      </div>
      <div class="tnav"><button class="btn btn-ghost" data-act="q-back">${icon('arrow-left')} ${esc(t('back'))}</button>
      ${qi === total - 1 ? `<button class="btn btn-lime" data-act="q-finish" ${n < total ? 'disabled' : ''}>${esc(t('finish'))} ${icon('check')}</button>` : `<button class="btn btn-violet" data-act="q-next" ${isAnswered(q, a) ? '' : 'disabled'}>${esc(t('next'))} ${icon('arrow-right')}</button>`}</div>
      ${qi === total - 1 && n < total ? `<p class="muted tiny center">${n}/${total} ${esc(t('answered'))}</p>` : ''}

  function mergeGuest() {
    const g = S.get(dataKey(null), null);
    if (!g || (!g.results || !g.results.length) && !Object.keys(g.answers || {}).length && !(g.favs || []).length) return false;
    const cur = App.data;

  async function cloudAuth(mode) {
    const C = NK.Cloud, err = $('#a-err'), btn = $('form[data-form] button[type=submit]');
    const email = $('#a-email').value.trim(), pass = $('#a-pass').value;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { err.textContent = t('auth_err_email'); return; }
    if (pass.length < 6) { err.textContent = t('auth_err_pass6'); return; }
    let nick = '';
    if (mode === 'register') {
      nick = $('#a-nick').value.trim();
      if (nick.length < 2 || nick.length > 30) { err.textContent = t('auth_err_nick'); return; }
      if (!$('#a-consent').checked) { err.textContent = t('auth_err_consent'); return; }
    }
    btn.disabled = true; err.textContent = ''; btn.textContent = t('cloud_wait');
    try {
      const guest = App.uid ? null : App.data;
      if (mode === 'register') {
        const r = await C.signUp({ email, password: pass, nickname: nick, grade: $('#a-grade').value, school: $('#a-school').value.trim(), role: $('#a-role').value });
        if (r.needsConfirm) { err.textContent = ''; $('.auth form').innerHTML = `<p class="warn">${icon('mail')} ${esc(t('auth_confirm'))}</p>`; return; }
      } else await C.signIn(email, pass);
      App.uid = C.user.id;
      const remote = await C.loadData();
      const hasGuest = guest && (guest.results.length || Object.keys(guest.tests || {}).length || guest.favs.length);
      if (remote) { S.set(dataKey(App.uid), remote); loadData(); }
      else if (hasGuest && me().role !== 'teacher') { App.data = Object.assign(blank(), guest); save(); S.del(dataKey(null)); toast(t('auth_merged')); }
      else { App.data = blank(); save(); }
      App.testView = 'intro';
      location.hash = me().role === 'teacher' ? 'teacher' : 'profile';
    } catch (e) {
      const m = String(e && e.message || '').toLowerCase();
      err.textContent = m.includes('invalid login') ? t('auth_err_wrong') : m.includes('already') ? t('auth_err_exists_email') : t('cloud_err');
      btn.disabled = false; btn.textContent = t(mode === 'register' ? 'auth_submit_reg' : 'auth_submit_login');
    }
  }
  function doAuth(mode) {
    if (cloudOn()) return cloudAuth(mode);
    const nick = $('#a-nick').value.trim(), pass = $('#a-pass').value, err = $('#a-err');
    if (nick.length < 2 || nick.length > 30) { err.textContent = t('auth_err_nick'); return; }
    if (pass.length < 4) { err.textContent = t('auth_err_pass'); return; }
    const us = users(); const found = Object.values(us).find(u => u.nick.toLowerCase() === nick.toLowerCase());

      }
      case 'gocat': App.ui.cf = Object.assign(App.ui.cf || { q: '', fav: false, sort: unified() ? 'match' : 'name' }, { cat: el.dataset.cat, q: '' }); location.hash = 'careers'; break;
      case 'car-cat': App.ui.cf.cat = el.dataset.cat; $$('.cchip', el.parentNode).forEach(b => { b.classList.toggle('on', b === el); b.setAttribute('aria-pressed', String(b === el)); }); $('#car-list').innerHTML = careerList(); break;
      case 'car-fav': App.ui.cf.fav = !App.ui.cf.fav; el.classList.toggle('on', App.ui.cf.fav); el.setAttribute('aria-pressed', String(App.ui.cf.fav)); $('#car-list').innerHTML = careerList(); break;
      case 'car-favonly': App.ui.cf = Object.assign(App.ui.cf || { q: '', cat: 'all', sort: 'name' }, { fav: true }); break;
      case 'uni-mine': App.ui.uf.mine = !App.ui.uf.mine; el.classList.toggle('on', App.ui.uf.mine); $('#uni-list').innerHTML = uniList(); break;
      case 'test-go': App.testView = 'q'; if (App.data.qi >= NK.QUESTIONS.length) App.data.qi = 0; { const firstOpen = NK.QUESTIONS.findIndex(qq => !isAnswered(qq, App.data.answers[qq.id])); if (firstOpen >= 0) App.data.qi = firstOpen; } save(); render(); break;
      case 'test-reset': case 'retake': App.data.answers = {}; App.data.qi = 0; save(); App.testView = 'q'; location.hash === '#test' ? render() : (location.hash = 'test'); break;
      case 'ans': {
        const v = +el.dataset.v;
        if (q.type === 'multi') {
          const cur = (App.data.answers[q.id] || []).slice(); const i = cur.indexOf(v);
          if (i >= 0) cur.splice(i, 1); else if (cur.length < q.max) cur.push(v); else { cur.shift(); cur.push(v); }
          App.data.answers[q.id] = cur; save(); render(true);
        } else {
          App.data.answers[q.id] = v; save(); render(true);
          if (App.data.qi < NK.QUESTIONS.length - 1) setTimeout(() => { if (App.testView === 'q' && NK.QUESTIONS[App.data.qi] === q) { App.data.qi++; save(); render(true); } }, 320);
        }
        break;
      }
      case 'q-next': if (App.data.qi < NK.QUESTIONS.length - 1) { App.data.qi++; save(); render(true); } break;
      case 'q-back': if (App.data.qi > 0) { App.data.qi--; save(); render(true); } else { App.testView = 'intro'; render(); } break;
      case 'q-finish': if (answeredCount() === NK.QUESTIONS.length) finishTest(); break;
      case 'rec': App.ui.openRec = App.ui.openRec === el.dataset.id ? null : el.dataset.id; { const li = el.closest('.rec'); const open = App.ui.openRec === el.dataset.id; $$('.rec').forEach(r => { r.classList.remove('open'); const b = $('.rec-b', r); if (b) b.hidden = true; const h = $('.rec-h', r); if (h) h.setAttribute('aria-expanded', 'false'); }); if (open) { li.classList.add('open'); $('.rec-b', li).hidden = false; el.setAttribute('aria-expanded', 'true'); } } break;
      case 'pdf':
        if (inFrame()) modal(`<h3>${icon('download')} ${esc(t('res_pdf'))}</h3><p>${esc(t('print_blocked'))}</p><textarea id="rep-txt" class="rep-txt" readonly>${esc(reportText())}</textarea><div class="cta-row"><button class="btn btn-lime btn-sm" data-act="copy-rep">${icon('copy')} ${esc(t('copy_report'))}</button><button class="btn btn-ghost btn-sm" data-act="modal-close">OK</button></div>`);
        else { toast(t('print_hint')); setTimeout(() => window.print(), 300); }
        break;
      case 'copy-rep': copyText($('#rep-txt')); break;
      case 'modal-close': closeModal(); break;
      case 'logout': (async () => { if (cloudOn()) { try { await NK.Cloud.flush(); } catch (err) { /* keep local copy */ } await NK.Cloud.signOut(); } App.uid = null; S.set('nk_session', null); loadData(); App.testView = 'intro'; location.hash = 'home'; render(); })(); break;
      default: if (NK.ACTIONS[act]) NK.ACTIONS[act](el, e);
    }
  });
  function closeMenus() { $$('.dd-menu').forEach(m => { m.hidden = true; }); $$('[data-act="dd"]').forEach(x => x.setAttribute('aria-expanded', 'false')); }
  document.addEventListener('click', e => { if (!e.target.closest('.dd')) closeMenus(); });
  function copyText(ta) {
    if (!ta) return;
    try { navigator.clipboard.writeText(ta.value).then(() => toast(t('copied')), () => { ta.select(); }); } catch (e) { ta.select(); }
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (!$('#modal').hidden) closeModal(); closeMenus(); }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-act="open"], [data-act="rec"], [data-act="rec2"]')) { e.preventDefault(); e.target.click(); }
  });
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
  document.addEventListener('input', e => {
    const k = e.target.dataset.input; if (!k) return;
    if (k === 'car-q') { App.ui.cf.q = e.target.value; $('#car-list').innerHTML = careerList(); }
    if (k === 'uni-q') { App.ui.uf.q = e.target.value; $('#uni-list').innerHTML = uniList(); }
    if (NK.INPUTS[k]) NK.INPUTS[k](e.target, e);
  });
  document.addEventListener('change', e => {
    const k = e.target.dataset.change; if (!k) return;
    if (k === 'car-sort') { App.ui.cf.sort = e.target.value; $('#car-list').innerHTML = careerList(); }
    if (k.startsWith('uni-')) { App.ui.uf[k.slice(4)] = e.target.value; $('#uni-list').innerHTML = uniList(); }
    if (NK.CHANGES[k]) NK.CHANGES[k](e.target, e);
  });
  document.addEventListener('submit', e => {
    const f = e.target.dataset.form; if (!f) return; e.preventDefault();
    if (f === 'login' || f === 'register') doAuth(f);
    else if (NK.FORMS[f]) NK.FORMS[f](e.target, e);
  });
  window.addEventListener('hashchange', () => {
    const d = $('#drawer'); if (d) d.hidden = true; closeMenus();
    if (location.hash === '#test' && App.testView === 'done') App.testView = 'intro';
    render();
  });

  /* ---------------- Exports for pages.js ---------------- */
  NK.H = { cloudOn, $, $$, esc, icon, t, L, ring, bar, toast, modal, closeModal, users, me, favBtn, profCard, pname, catName, uniName, render, rerenderKeep, inFrame, S, dataKey, copyText, blank, loadData, isFav, logoSvg,
    radarG: (keys, sc, label) => radar(sc, null, keys, label) };
  /* ---------------- Boot (called by pages.js after all modules are registered) ---------------- */
  NK.boot = async () => {
    if (cloudOn()) {
      $('#view').innerHTML = `<section class="page"><div class="wrap center"><p class="muted">${esc(t('cloud_loading'))}</p></div></section>`;
      try {
        await NK.Cloud.init();
        App.uid = NK.Cloud.user ? NK.Cloud.user.id : null;
        if (App.uid) { const remote = await NK.Cloud.loadData(); if (remote) S.set(dataKey(App.uid), remote); }
      } catch (e) { App.uid = NK.Cloud.user ? NK.Cloud.user.id : null; setTimeout(() => toast(t('cloud_err')), 500); }
    }
    loadData();
    if (location.hash === '#test' && Object.keys(App.data.answers).length && answeredCount() < NK.QUESTIONS.length) App.testView = 'intro';
    renderFooter();
    render();
  };
})();

</script>
<script>
/* N-KELL — pages for the integrated journey: Discover → Explore → Experience → Compare → Plan.
   Uses helpers exported by app.js (NK.H) and pure logic from engine.js (NK.Engine). */
(function () {
  'use strict';
  const NK = window.NK, H = NK.H, E = NK.Engine;
  const { $, $$, esc, icon, t, L } = H;
  const P = NK.PAGES, A = NK.ACTIONS, F = NK.FORMS, C = NK.CHANGES, I = NK.INPUTS;
  const D = () => NK.App.data;
  const ui = () => NK.App.ui;
  const rec = () => NK.rec();
  const tName = id => L(NK.TEST[id].title);
  const tstate = id => { const d = D(); d.tests[id] = d.tests[id] || { answers: {}, idx: 0 }; return d.tests[id]; };
  const fmtDate = iso => (iso ? new Date(iso).toLocaleDateString(NK.App.lang === 'en' ? 'en-GB' : 'ru-RU') : '');
  const pname = H.pname, catName = H.catName;
  const dim = (src, d) => NK.dimName(src, d);
  const SRC_OF = { interests: 'riasec', strengths: 'strengths', values: 'values', env: 'env', motivation: 'motivation', personality: 'bigfive' };
  const band = v => { const b = E.band(v); return `<span class="band band-${b}">${esc(t('band_' + b))}</span>`; };
  const sbar = (label, v, extra) => `<div class="bar-row"><div class="bar-lbl"><span>${esc(label)} ${v == null ? '' : band(v)}</span><b>${v == null ? '—' : v + '%'}</b></div><div class="bar ${v == null ? 'na' : ''}"><i style="--w:${Math.max(2, v || 0)}%"></i></div>${extra || ''}</div>`;
  const srcChip = src => `<span class="src">${icon('info')} ${esc(src === 'express' ? t('src_express') : tName(src))}</span>`;
  const legend = () => `<p class="tiny muted bands-l">${band(20)} 0–39 · ${band(50)} 40–59 · ${band(80)} 60–100 — ${esc(t('band_note'))}</p>`;
  const empty = (ic, title, text, href, btn) => `<div class="empty-s">${icon(ic)}<p><b>${esc(title)}</b></p><p>${esc(text)}</p>${href ? `<a class="btn btn-lime btn-sm" href="#${href}">${esc(btn)} ${icon('arrow-right')}</a>` : ''}</div>`;
  const markOnce = (key, val) => { const d = D(); if (JSON.stringify(d[key]) !== JSON.stringify(val)) { d[key] = val; NK.save(); } };

  /* ======================== Progress helpers ======================== */
  function testsDone(d) { return NK.TESTS.filter(x => E.testResult(d || D(), x.id)).length; }
  NK.testsDone = testsDone;

  /* ======================== Roadmap model ======================== */
  function roadStages(d) {
    d = d || D();
    const r = NK.Engine.recommend(d, NK.PROFS);
    const top = r.best.slice(0, 3).map(m => NK.PROF[m.id]);
    const subj = [...new Set(top.flatMap(p => p.subj))].slice(0, 5).map(NK.subjName).join(', ');
    const dev = E.development(r.P, r, d);
    const done = id => !!E.testResult(d, id);
    const simsN = Object.keys(d.sims || {}).length;
    const S = (id, k, auto, href) => ({ id, k, auto, href });
    const stages = [
      { k: 'rs_1', ic: 'compass', tasks: [S('a_riasec', ['rt_test', { test: tName('riasec') }], done('riasec') || (d.results || []).length > 0, 'test-riasec'), S('a_bigfive', ['rt_test', { test: tName('bigfive') }], done('bigfive'), 'test-bigfive'), S('a_values', ['rt_test', { test: tName('values') }], done('values'), 'test-values'), S('s1_code', ['rt_profile'], null, 'me')] },
      { k: 'rs_2', ic: 'search', tasks: [S('a_view3', ['rt_view3'], (d.viewed || []).length >= 3, 'recs'), S('s2_day', ['rt_day'], null, 'careers'), S('s2_beyond', ['rt_beyond'], null, 'recs'), S('s2_int', ['rt_interview'], null)] },
      { k: 'rs_3', ic: 'swords', tasks: [S('a_compare', ['rt_compare'], (d.compares || []).length > 0, 'compare'), S('s3_pros', ['rt_pros'], null)] },
      { k: 'rs_4', ic: 'book-open', tasks: [S('a_unt', ['rt_unt'], !!d.untVisited, 'unt'), S('s3_subj', ['rt_subj', { s: subj || '—' }], null), S('s3_unt', ['rt_unt_official'], null, NK.UNT_META.sources[0].url)] },
      { k: 'rs_5', ic: 'school', tasks: [S('s5_uni3', ['rt_uni3'], null, 'unis'), S('s5_adm', ['rt_adm'], null), S('s5_open', ['rt_open'], null)] },
      { k: 'rs_6', ic: 'zap', tasks: [S('a_sim1', ['rt_sim1'], simsN >= 1, 'sim'), S('a_sim3', ['rt_sim3'], simsN >= 3, 'sim'), S('a_strengths', ['rt_test', { test: tName('strengths') }], done('strengths'), 'test-strengths')].concat(dev.improve.slice(0, 2).map(x => S('s6_dev_' + x.d, ['rt_dev', { s: dim('strengths', x.d) }], null))).concat([S('s4_course', ['rt_course'], null)]) },
      { k: 'rs_7', ic: 'flag', tasks: [S('a_ready', ['rt_test', { test: tName('readiness') }], done('readiness'), 'test-readiness'), S('s1_talk', ['rt_talk'], null), S('s7_retake', ['rt_retake'], null, 'tests'), S('s7_review', ['rt_review'], null)] }
    ];
    const custom = (d.tasks || []);
    stages.forEach((s, i) => { s.custom = custom.filter(x => x.stage === i + 1); });
    return stages;
  }
  const taskDone = (task, d) => (task.auto != null ? !!task.auto : !!(d || D()).road.done[task.id]);
  function roadProgress(d) {
    d = d || D();
    const st = roadStages(d); const all = st.flatMap(s => s.tasks); const cus = st.flatMap(s => s.custom); const goals = d.road.goals || [];
    const done = all.filter(x => taskDone(x, d)).length + cus.filter(x => x.done).length + goals.filter(g => g.done).length;
    const total = all.length + cus.length + goals.length;
    return { done, total, pct: total ? Math.round(done / total * 100) : 0 };
  }
  NK.roadProgress = roadProgress;

  /* ======================== Next best step card ======================== */
  function nextStepCard(big) {
    const d = D(), r = rec(), ns = E.nextStep(d, r);
    const vars = Object.assign({}, ns.vars || {});
    if (vars.test) vars.test = tName(vars.test);
    if (ns.k === 'ns_sim') vars.p = vars.p ? pname(NK.PROF[vars.p]) : t('nav_sim');
    return `<a class="nstep ${big ? 'big' : ''}" href="#${ns.href}"><span class="nstep-ic">${icon('sparkles')}</span><div><small>${esc(t('ns_title'))}</small><b>${esc(t(ns.k, vars))}</b></div>${icon('arrow-right')}</a>`;
  }
  NK.nextStepText = () => { const ns = E.nextStep(D(), rec()); const vars = Object.assign({}, ns.vars || {}); if (vars.test) vars.test = tName(vars.test); if (ns.k === 'ns_sim') vars.p = vars.p ? pname(NK.PROF[vars.p]) : t('nav_sim'); return { text: t(ns.k, vars), href: ns.href }; };

  /* ======================== DASHBOARD ======================== */
  P.dashboard = function () {
    const d = D(), u = H.me(), r = rec(), n = testsDone();
    const rp = roadProgress();
    const parts = [n / NK.TESTS.length, Math.min((d.viewed || []).length, 3) / 3, Math.min(Object.keys(d.sims).length, 3) / 3, (d.compares || []).length ? 1 : 0, rp.pct / 100];
    const overall = Math.round(parts.reduce((s, v) => s + v, 0) / parts.length * 100);
    const code = r.P.riasec ? E.sortDims(r.P.riasec.s).slice(0, 3) : null;
    const recentSims = Object.keys(d.sims).map(id => [id, d.sims[id]]).sort((a, b) => (b[1].date || '').localeCompare(a[1].date || '')).slice(0, 3);
    return `<section class="page"><div class="wrap">
      <div class="dash-head"><div><span class="eyebrow">${icon('home')} ${esc(t('nav_dash'))}</span><h1 class="h1">${esc(u ? t('dash_hello', { n: u.nick }) : t('dash_hello_guest'))}</h1><p class="lead">${esc(t('dash_sub'))}</p></div>
        <div class="dash-ring">${H.ring(overall, 104, 'lime')}<small>${esc(t('dash_overall'))}</small></div></div>
      ${nextStepCard(true)}
      <div class="journey">${[['discover', 'compass', 'tests'], ['explore', 'search', 'recs'], ['experience', 'play', 'sim'], ['compare', 'swords', 'compare'], ['plan', 'route', 'roadmap']].map(([k, ic, h], i) => `<a href="#${h}" class="jstep"><span>${i + 1}</span>${icon(ic)}<b>${esc(t('stage_' + k))}</b><small>${esc(t('stage_' + k + '_d'))}</small></a>`).join('')}</div>
      <div class="dash-grid">
        <div class="card"><h3>${icon('clipboard-list')} ${esc(t('dash_tests'))} <span class="muted tiny">${n}/${NK.TESTS.length}</span></h3>
          <div class="tchips">${NK.TESTS.map(x => { const r0 = E.testResult(d, x.id); const st = d.tests[x.id]; const prog = st && !r0 ? Object.keys(st.answers || {}).length : 0; return `<a href="#test-${x.id}" class="tchip ${r0 ? 'done' : prog ? 'prog' : ''}">${icon(r0 ? 'check-circle-2' : x.icon)}<span>${esc(tName(x.id))}</span>${r0 ? '' : prog ? `<small>${prog}/${x.items.length}</small>` : ''}</a>`; }).join('')}</div></div>
        <div class="card"><h3>${icon('user-round')} ${esc(t('dash_profile'))}</h3>
          ${code ? `<div class="mini-prof"><div class="code big">${code.map(c => `<i class="c-${c}">${c}</i>`).join('')}</div>${srcChip(r.P.riasec.src)}</div>
            ${r.P.values ? `<p class="tiny muted">${esc(t('me_values'))}</p><ul class="chips">${E.sortDims(r.P.values.s).slice(0, 3).map(k => `<li>${esc(dim('values', k))}</li>`).join('')}</ul>` : ''}
            ${r.P.motivation ? `<p class="tiny muted">${esc(t('me_motiv'))}</p><ul class="chips">${E.sortDims(r.P.motivation.s).slice(0, 2).map(k => `<li>${esc(dim('motivation', k))}</li>`).join('')}</ul>` : ''}
            <a href="#me" class="btn btn-ghost btn-sm">${esc(t('nav_me'))} ${icon('arrow-right')}</a>` : empty('user-round', t('dash_noprof'), t('dash_noprof_d'), 'test-riasec', t('cta_start_riasec'))}</div>
        <div class="card"><h3>${icon('trophy')} ${esc(t('dash_recs'))}</h3>${r.best.length ? `<div class="minis">${r.best.slice(0, 3).map(m => miniCareer(m)).join('')}</div><p class="tiny muted">${esc(t('cov_short', { p: Math.round(r.coverage * 100) }))}</p><a href="#recs" class="btn btn-ghost btn-sm">${esc(t('nav_recs'))} ${icon('arrow-right')}</a>` : empty('trophy', t('recs_none'), t('recs_none_d'), 'test-riasec', t('cta_start_riasec'))}</div>
        <div class="card"><h3>${icon('heart')} ${esc(t('road_favs'))}</h3>${d.favs.length ? `<div class="minis">${d.favs.filter(id => NK.PROF[id]).slice(0, 4).map(id => miniCareer(r.byId[id] || { id })).join('')}</div>` : `<p class="muted tiny">${esc(t('road_nofavs'))}</p><a href="#careers" class="btn btn-ghost btn-sm">${esc(t('nav_careers'))}</a>`}</div>
        <div class="card"><h3>${icon('play')} ${esc(t('dash_sims'))}</h3>${recentSims.length ? `<div class="minis">${recentSims.map(([id, s]) => `<a class="mini" href="#sim-${id}"><span class="pic sm">${icon(NK.SIMS[id] ? NK.SIMS[id].icon : 'play')}</span><span><b>${esc(NK.SIMS[id] ? L(NK.SIMS[id].title) : id)}</b><small>${fmtDate(s.date)}</small></span><span class="mpill">${s.best}%</span></a>`).join('')}</div>` : `<p class="muted tiny">${esc(t('dash_nosims'))}</p><a href="#sim" class="btn btn-ghost btn-sm">${esc(t('nav_sim'))}</a>`}</div>
        <div class="card"><h3>${icon('route')} ${esc(t('nav_road'))}</h3><p class="muted">${rp.done} / ${rp.total}</p><div class="tbar"><i style="--w:${rp.pct}%"></i></div><a href="#roadmap" class="btn btn-ghost btn-sm">${esc(t('nav_road'))} ${icon('arrow-right')}</a></div>
      </div>
      ${u ? '' : `<div class="warn">${icon('info')}<p>${esc(t('prof_guest'))} <a href="#register">${esc(t('register'))} →</a></p></div>`}
    </div></section>`;
  };
  function miniCareer(m) {
    const p = NK.PROF[m.id];
    return `<a class="mini" href="#career-${p.id}"><span class="pic sm">${icon(p.icon)}</span><span><b>${esc(pname(p))}</b><small>${esc(catName(p.cat))} · ${p.code}</small></span>${m.total != null ? `<span class="mpill">${m.total}%</span>` : ''}</a>`;
  }
  NK.miniCareer = miniCareer;

  /* ======================== TEST CENTER ======================== */
  P.tests = function () {
    const d = D();
    const card = x => {
      const r0 = E.testResult(d, x.id), st = d.tests[x.id], prog = st && !r0 ? Object.keys(st.answers || {}).length : 0;
      return `<article class="tcard card"><div class="tcard-h"><span class="pic" style="--tc:${x.color}">${icon(x.icon)}</span>${r0 ? `<span class="chip-ok">${icon('check')} ${esc(t('tc_done'))} · ${fmtDate(r0.date)}</span>` : prog ? `<span class="chip-warn">${esc(t('tc_inprog'))} ${prog}/${x.items.length}</span>` : ''}</div>
        <h3>${esc(tName(x.id))}</h3><p class="muted">${esc(L(x.purpose))}</p>
        <p class="tmeta">${icon('timer')} ~${x.minutes} ${esc(t('min'))} · ${icon('clipboard-list')} ${x.items.length} ${esc(t('tc_items'))}</p>
        <div class="cta-row">${r0 ? `<a class="btn btn-violet btn-sm" href="#test-${x.id}">${esc(t('tc_view'))}</a>` : `<a class="btn btn-lime btn-sm" href="#test-${x.id}">${esc(t(prog ? 'test_continue' : 'test_start'))} ${icon('arrow-right')}</a>`}</div></article>`;
    };
    const ex = d.results.length;
    return `<section class="page"><div class="wrap">
      <span class="eyebrow">${icon('compass')} ${esc(t('stage_discover'))}</span><h1 class="h1">${esc(t('tc_h'))}</h1><p class="lead">${esc(t('tc_sub'))}</p>
      <div class="safe card">${icon('shield-check')}<div><h3>${esc(t('safe_h'))}</h3><ul class="dl">${['safe_1', 'safe_2', 'safe_3', 'safe_4', 'safe_5'].map(k => `<li>${esc(t(k))}</li>`).join('')}</ul></div></div>
      <div class="tgrid">${NK.TESTS.map(card).join('')}
        <article class="tcard card express"><div class="tcard-h"><span class="pic">${icon('zap')}</span>${ex ? `<span class="chip-ok">${icon('check')} ${ex}×</span>` : ''}</div><h3>${esc(t('ex_title'))}</h3><p class="muted">${esc(t('ex_desc'))}</p><p class="tmeta">${icon('timer')} ~10 ${esc(t('min'))} · ${icon('clipboard-list')} 30 ${esc(t('tc_items'))}</p>
        <div class="cta-row"><a class="btn btn-ghost btn-sm" href="#test">${esc(t(ex ? 'test_restart' : 'test_start'))}</a>${ex ? `<a class="btn btn-ghost btn-sm" href="#results">${esc(t('tc_view'))}</a>` : ''}</div></article>
      </div>
    </div></section>`;
  };

  /* ======================== TEST RUNNER ======================== */
  P['test-'] = function (id) {
    const x = NK.TEST[id]; if (!x) return null;
    const st = tstate(id); const r0 = E.testResult(D(), id);
    ui().tv = ui().tv || {};
    const view = ui().tv[id] || (r0 ? 'res' : 'intro');
    if (view === 'q') return testQ(x, st);
    if (view === 'res' && r0) return testRes(x, r0);
    const n = Object.keys(st.answers).length;
    return `<section class="page"><div class="wrap narrow">
      <a href="#tests" class="back">${icon('arrow-left')} ${esc(t('tc_h'))}</a>

      <div class="card"><h3>${icon('target')} ${esc(t('ti_purpose'))}</h3><p>${esc(L(x.purpose))}</p><h3 class="mt">${icon('clipboard-list')} ${esc(t('ti_instr'))}</h3><p>${esc(L(x.instr))}</p></div>

      <div class="cta-row"><button class="btn btn-lime btn-lg" data-act="t-go" data-id="${id}">${esc(t(n ? 'test_continue' : 'test_start'))}${n ? ` (${n}/${x.items.length})` : ''} ${icon('arrow-right')}</button>${n ? `<button class="btn btn-ghost" data-act="t-reset" data-id="${id}">${icon('rotate-ccw')} ${esc(t('test_restart'))}</button>` : ''}${r0 ? `<button class="btn btn-ghost" data-act="t-view" data-id="${id}">${esc(t('tc_view'))}</button>` : ''}</div>

    }
    if (it.type === 'choice') return `${it.scene ? `<div class="scene">${icon('lightbulb')}<div><small>${esc(t('situation'))}</small><p>${esc(L(it.scene))}</p></div></div>` : ''}${lab}<div class="opts ${it.opts.length > 4 ? 'two' : ''}" role="radiogroup">${it.opts.map((o, k) => `<button class="opt ${a === k ? 'on' : ''}" data-act="t-ans" data-v="${k}" role="radio" aria-checked="${a === k}"><span class="opt-k">${String.fromCharCode(65 + k)}</span><span>${esc(L(o.t))}</span></button>`).join('')}</div>`;

    if (it.type === 'bipolar') return `${lab}<div class="bip"><span class="bip-l">${esc(L(it.l.t))}</span><div class="bip-dots" role="radiogroup">${[1, 2, 3, 4, 5].map(v => `<button class="bd ${a === v ? 'on' : ''} s${v}" data-act="t-ans" data-v="${v}" role="radio" aria-checked="${a === v}" aria-label="${v}"><i></i></button>`).join('')}</div><span class="bip-r">${esc(L(it.r.t))}</span></div><p class="tiny muted center">${esc(t('bip_hint'))}</p>`;

  function testQ(x, st) {

  A['t-go'] = el => { const id = el.dataset.id; const x = NK.TEST[id], st = tstate(id); const first = x.items.findIndex(it => st.answers[it.id] == null); st.idx = first >= 0 ? first : 0; ui().tv[id] = 'q'; NK.save(); H.render(); };
  A['t-reset'] = el => { const id = el.dataset.id; const st = tstate(id); st.answers = {}; st.idx = 0; ui().tv[id] = 'q'; NK.save(); H.render(); };

  const curTest = () => { const h = location.hash.slice(1); return h.startsWith('test-') ? h.slice(5) : null; };

  A['t-back'] = () => { const id = curTest(), st = tstate(id); if (st.idx > 0) { st.idx--; NK.save(); H.render(true); } else { ui().tv[id] = 'intro'; H.render(); } };
  A['t-finish'] = () => {

    st.done = true; st.history = (st.history || []).concat([{ date: st.result.date, scores: res.scores }]).slice(-5);

  /* ======================== TEST RESULTS ======================== */

    }
    return `<section class="page"><div class="wrap">${resHead(x, r0)}${body}${resFoot(x)}</div></section>`;
  }

  /* ======================== MY PROFILE (unified) ======================== */
  P.me = function () {

    const top = (k, n) => (Pf[k] ? E.sortDims(Pf[k].s).slice(0, n) : []);
    const demo = E.demonstrated(d);
    const cardFor = (k, ic) => {
      const p = Pf[k];
      if (!p) return `<div class="card pcard3 missing"><h3>${icon(ic)} ${esc(tName(k))}</h3><p class="muted tiny">${esc(t('me_missing'))}</p><a href="#test-${k}" class="btn btn-ghost btn-sm">${esc(t('test_start'))}</a></div>`;
      const s = p.s; let inner = '';
      if (k === 'riasec') { const c = top(k, 3); inner = `<div class="code big">${c.map(x => `<i class="c-${x}">${x}</i>`).join('')}</div><p class="tiny">${esc(c.map(x => t('k_' + x)).join(' · '))}</p>`; }
      else if (k === 'bigfive') inner = NK.TEST.bigfive.dims.map(x => sbar(L(NK.TEST.bigfive.info[x].name), s[x])).join('');

  async function ask(q) {
    const d = D(); q = (q || '').trim(); if (!q) return;
